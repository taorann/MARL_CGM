[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphplanner-agent-rebuild"
version = "0.1.0"
description = "Train-free GraphPlanner code-repair agent rebuild"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
graphplanner-eval = "graphplanner_agent.cli.eval:main"
graphplanner-smoke = "graphplanner_agent.cli.smoke:main"
graphplanner-check-stack = "graphplanner_agent.cli.check_stack:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
